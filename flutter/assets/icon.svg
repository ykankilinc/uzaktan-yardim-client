<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Uzaktan Yardım</title>
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Zemin -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Monitör -->
  <rect x="92" y="132" width="308" height="210" rx="30" fill="none" stroke="#FFFFFF" stroke-width="28"/>
  <path d="M246 342 V392 M178 396 H314" fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round"/>

  <!-- İmleç (uzaktan kontrol) -->
